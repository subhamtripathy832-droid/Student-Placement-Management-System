{% extends "base.html" %}
{% block title %}Register | {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-card wide"><p class="eyebrow">STUDENT ACCOUNT</p><h1>Create your account</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid"><label>Full name<input name="full_name" maxlength="120" required value="{{ request.form.get('full_name','') }}"></label>
  <label>Email<input type="email" name="email" maxlength="160" required value="{{ request.form.get('email','') }}"></label>
  <label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required><small>Use at least 8 characters.</small></label>
  <label>Department<input name="department" maxlength="100" placeholder="e.g. Computer Science"></label>
  <label>Graduation year<input type="number" name="graduation_year" min="2000" max="2100"></label>
  <label>CGPA (out of 10)<input type="number" name="cgpa" min="0" max="10" step="0.01"></label></div>
  <button class="button full-width" type="submit">Register</button>
</form><p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></div>
{% endblock %}
