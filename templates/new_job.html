{% extends "base.html" %}
{% block title %}Post a Job | {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-card wide"><p class="eyebrow">ADMINISTRATION</p><h1>Create job posting</h1>
{% if companies %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Company<select name="company_id" required><option value="">Choose a company</option>{% for company in companies %}<option value="{{ company.id }}">{{ company.name }}</option>{% endfor %}</select></label><label>Job title<input name="title" maxlength="160" required></label><label>Location<input name="location" maxlength="160"></label><label>Minimum CGPA<input type="number" name="minimum_cgpa" min="0" max="10" step="0.01" value="0"></label><label>Eligible departments<input name="eligible_departments" value="All" placeholder="All or comma-separated names"><small>Example: Computer Science, Information Technology</small></label><label>Graduation year (optional)<input type="number" name="graduation_year" min="2000" max="2100"></label><label>Application deadline<input type="date" name="deadline"></label></div><label>Job description<textarea name="description" rows="5" required></textarea></label><button class="button" type="submit">Publish job</button></form>{% else %}<p class="notice">Add a company before creating a job posting.</p><a class="button" href="{{ url_for('admin.companies') }}">Add company</a>{% endif %}</div>
{% endblock %}
