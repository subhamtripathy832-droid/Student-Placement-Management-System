{% extends "base.html" %}
{% block title %}Login | {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Email<input type="email" name="email" autocomplete="email" required></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <button class="button full-width" type="submit">Log in</button>
</form><p class="muted">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div>
{% endblock %}
